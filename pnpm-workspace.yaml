allowBuilds:
  esbuild: true

minimumReleaseAge: 1440

# semver override -> 7.x: eslint-plugin-import needs semver@6.3.1, which trips
# no-downgrade (lost provenance, no newer 6.x). 6.x API is a subset of 7.x.
# Drop when eslint-plugin-import uses 7.x.
trustPolicy: no-downgrade

# overrides should be reviewed and removed when dependent packages are updated
overrides:
  rollup: 4.59.0
  semver: 7.8.0
